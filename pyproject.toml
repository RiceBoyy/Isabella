[project]
name = "isabella"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
